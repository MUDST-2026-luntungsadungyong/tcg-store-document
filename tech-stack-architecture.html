<!DOCTYPE html>

  <style>

<body class="bg-transparent text-slate-100 p-2 md:p-4 antialiased">

      <div class="flex items-center gap-2">

        </button>
        <button onclick="downloadPng()" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 active:scale-95 transition-all flex items-center gap-1 cursor-pointer">

      <stop offset="50%" stop-color="#12243c" />

    </div>

  <canvas id="exportCanvas" style="display:none;"></canvas>

  <script>
    function copySvg() {
      const svgEl = document.querySelector('#svgContainer svg');
      const s = new XMLSerializer().serializeToString(svgEl);
      navigator.clipboard.writeText(s).then(() => {
        const copyText = document.getElementById('copyText');
        copyText.textContent = 'คัดลอกแล้ว!';
        setTimeout(() => { copyText.textContent = 'คัดลอก SVG'; }, 2000);
      }).catch(() => {
        alert('คัดลอกไม่สำเร็จ โปรดคลิกดาวน์โหลด SVG แทน');
      });
    }

    function downloadSvg() {
      const svgEl = document.querySelector('#svgContainer svg');
      const s = new XMLSerializer().serializeToString(svgEl);
      const blob = new Blob([s], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'tech-stack-architecture.svg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function downloadPng() {
      const svgEl = document.querySelector('#svgContainer svg');
      const s = new XMLSerializer().serializeToString(svgEl);
      const blob = new Blob([s], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = function() {
        const canvas = document.getElementById('exportCanvas');
        const scale = 2; // High-Res Retina
        canvas.width = 1200 * scale;
        canvas.height = 580 * scale;
        const ctx = canvas.getContext('2d');
        ctx.scale(scale, scale);
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        
        canvas.toBlob(function(pngBlob) {
          const pngUrl = URL.createObjectURL(pngBlob);
          const a = document.createElement('a');
          a.href = pngUrl;
          a.download = 'tech-stack-architecture-2x.png';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(pngUrl);
        }, 'image/png');
      };
      img.src = url;
    }
  </script>
